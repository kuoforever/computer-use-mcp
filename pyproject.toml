[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-desktop-agent"
version = "0.1.0"
description = "Durable, safety-governed desktop agent and MCP server for Windows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.27.2,<2",        # MCP server/client SDK; tested stdio contract
    "mss>=9.0",              # screen capture
    "uiautomation>=2.0.18",  # UIA accessibility tree + patterns
    "psutil>=5.9",           # process-tree for the foreground gate
    "pillow>=10.0",          # bbox annotation in smoke tests
    "winrt-runtime~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.UI.ViewManagement~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications~=3.2.1; sys_platform == 'win32'",
    "pywin32>=312; sys_platform == 'win32'",
    "comtypes>=1.4.16; sys_platform == 'win32'",
]
# Mouse/keyboard input is done via ctypes (keybd_event/mouse_event) and
# uiautomation.SendKeys — no pyautogui dependency needed.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5,<0.16", "mypy>=1.11", "build>=1.2", "setuptools>=77.0.3"]
agent-openai = ["openai>=1.68,<3"]
agent-anthropic = ["anthropic>=0.77,<1"]
agent = ["openai>=1.68,<3", "anthropic>=0.77,<1"]
browser = ["playwright>=1.60,<2"]
# Observability is opt-in. Without it the telemetry port stays a no-op and
# opens no connection, so offline runs and CI never depend on a collector.
observability = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
# Proof of concept only. The main package never imports temporalio, and no
# runtime path depends on a Temporal server being reachable.
temporal = ["temporalio>=1.7"]

[project.scripts]
guarded-desktop-mcp = "computer_use_mcp.server:main"
guarded-desktop-agent = "computer_use_agent.cli:main"
guarded-desktop-agent-console = "computer_use_agent.formal_demo_console_launcher:main"
# Compatibility aliases retained for existing MCP clients and operator scripts.
computer-use-mcp = "computer_use_mcp.server:main"
computer-use-agent = "computer_use_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
computer_use_agent = ["assets/*.docx"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "openai_integration: opt-in live OpenAI Responses API test with a harmless fake MCP child",
    "formal_demo_openai_integration: opt-in one-call OpenAI Formal Demo TaskIntent and Scope gate with no tools or desktop path",
    "anthropic_integration: opt-in live Claude Messages API test with a harmless fake MCP child",
    "kimi_integration: opt-in live Kimi Chat Completions API matrix with a harmless fake MCP child",
    "deepseek_integration: opt-in live DeepSeek Chat Completions API matrix with a harmless fake MCP child",
    "glm_integration: opt-in live GLM Chat Completions API matrix with a harmless fake MCP child",
    "minimax_integration: opt-in live MiniMax Messages API matrix with a harmless fake MCP child",
    "doubao_integration: opt-in live Doubao Responses API matrix with a harmless fake MCP child",
    "qwen_integration: opt-in live Qwen Responses API matrix with a harmless fake MCP child",
]

[tool.mypy]
# Type checking is on by default for everything under src/, so a new module is
# checked the day it is written. The exemptions below are pre-existing debt.
#
# The rule for this list: it may only shrink. Adding a module to it is not a
# way to land new code, and a module removed from it must stay clean.
python_version = "3.11"
files = ["src"]
# Windows, UIA, and provider SDK stubs are incomplete or absent. Scoped
# per-module overrides are preferred over silencing a whole error class.
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "computer_use_agent.campaign"
ignore_errors = true

