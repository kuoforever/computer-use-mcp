[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-mcp"
version = "0.0.0"
description = "Model-agnostic computer-use MCP server for Windows (A-path, in-process Python)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.2",         # MCP server SDK (used from v0.3 onward)
    "mss>=9.0",         # screen capture
    "uiautomation>=2.0.18",  # UIA accessibility tree + patterns
    "pyautogui>=0.9.54",     # mouse/keyboard (used from v0.1 onward)
    "psutil>=5.9",      # process-tree for the foreground gate
    "pillow>=10.0",     # bbox annotation in the smoke test
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
