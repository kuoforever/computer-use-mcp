[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-mcp"
version = "0.1.0"
description = "Model-agnostic computer-use MCP server for Windows (A-path, in-process Python)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.27.2,<2",        # MCP server/client SDK; tested stdio contract
    "mss>=9.0",              # screen capture
    "uiautomation>=2.0.18",  # UIA accessibility tree + patterns
    "psutil>=5.9",           # process-tree for the foreground gate
    "pillow>=10.0",          # bbox annotation in smoke tests
    "winrt-runtime~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr~=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams~=3.2.1; sys_platform == 'win32'",
]
# Mouse/keyboard input is done via ctypes (keybd_event/mouse_event) and
# uiautomation.SendKeys — no pyautogui dependency needed.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2", "setuptools>=77.0.3"]
agent-openai = ["openai>=1.68,<3"]
agent-anthropic = ["anthropic>=0.77,<1"]
agent = ["openai>=1.68,<3", "anthropic>=0.77,<1"]

[project.scripts]
computer-use-mcp = "computer_use_mcp.server:main"
computer-use-agent = "computer_use_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "openai_integration: opt-in live OpenAI Responses API test with a harmless fake MCP child",
    "anthropic_integration: opt-in live Claude Messages API test with a harmless fake MCP child",
]
