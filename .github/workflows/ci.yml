name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline quality (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Types
        run: python -m mypy
      - name: Documentation consistency
        run: python scripts/check_docs_consistency.py
      - name: Offline tests
        run: python -m pytest -q
      - name: Crash reconstruction E2 gate
        run: python -m pytest tests\agent\test_reconstruction.py tests\agent\test_recovery.py::test_e2_runtime_recovery_matrix_freezes_exact_new_external_calls -q --junitxml out\crash-reconstruction-e2.xml
      - name: Upload crash reconstruction report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crash-reconstruction-e2-python-${{ matrix.python-version }}
          path: out/crash-reconstruction-e2.xml
          if-no-files-found: warn
          retention-days: 14
      - name: OpenAI stateless replay E2 gate
        run: python -m pytest tests\agent\test_openai_replay_evaluation.py -q --junitxml out\openai-stateless-replay-e2.xml
      - name: Upload stateless replay report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openai-stateless-replay-e2-python-${{ matrix.python-version }}
          path: out/openai-stateless-replay-e2.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Deterministic E1/E2 gate
        run: computer-use-agent eval --cases evals\cases --manifest evals\e5-case-manifest.json --report out\e1-e2-report.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e1-e2-python-${{ matrix.python-version }}
          path: out/e1-e2-report.json
          if-no-files-found: warn
          retention-days: 14

  wheel-smoke:
    name: Wheel build and clean install
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel
      - name: Install wheel into clean environment
        shell: pwsh
        run: |
          python -m venv .wheel-venv
          $wheelPath = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          $wheelSpec = '{0}[agent-openai,agent-anthropic]' -f $wheelPath
          .\.wheel-venv\Scripts\python.exe -m pip install --disable-pip-version-check $wheelSpec
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe --help
          $env:OPENAI_API_KEY = "doctor-only-placeholder"
          $env:ANTHROPIC_API_KEY = "doctor-only-placeholder"
          $openAIConfig = Join-Path $env:RUNNER_TEMP "guarded-desktop-agent-openai.toml"
          $anthropicConfig = Join-Path $env:RUNNER_TEMP "guarded-desktop-agent-anthropic.toml"
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe config init --provider openai --model wheel-smoke --output $openAIConfig
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe config doctor --config $openAIConfig
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe config validate --config $openAIConfig
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe approval inbox --config $openAIConfig --json
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe config init --provider anthropic --model wheel-smoke --output $anthropicConfig
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe config doctor --config $anthropicConfig
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe config validate --config $anthropicConfig
          Remove-Item Env:OPENAI_API_KEY
          Remove-Item Env:ANTHROPIC_API_KEY
          .\.wheel-venv\Scripts\guarded-desktop-agent.exe eval --cases evals\cases --manifest evals\e5-case-manifest.json --report out\wheel-e1-e2-report.json
      - name: Upload wheel and smoke report
        uses: actions/upload-artifact@v6
        with:
          name: wheel-and-smoke-report
          path: |
            dist/*.whl
            out/wheel-e1-e2-report.json
          if-no-files-found: error
          retention-days: 14
