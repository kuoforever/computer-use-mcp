name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline quality (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Offline tests
        run: python -m pytest -q
      - name: Deterministic E1/E2 gate
        run: computer-use-agent eval --cases evals\cases --report out\e1-e2-report.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e1-e2-python-${{ matrix.python-version }}
          path: out/e1-e2-report.json
          if-no-files-found: warn
          retention-days: 14

  wheel-smoke:
    name: Wheel build and clean install
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel
      - name: Install wheel into clean environment
        shell: pwsh
        run: |
          python -m venv .wheel-venv
          .\.wheel-venv\Scripts\python.exe -m pip install --disable-pip-version-check (Get-ChildItem dist\*.whl).FullName
          .\.wheel-venv\Scripts\computer-use-agent.exe --help
          .\.wheel-venv\Scripts\computer-use-agent.exe eval --cases evals\cases --report out\wheel-e1-e2-report.json
      - name: Upload wheel and smoke report
        uses: actions/upload-artifact@v6
        with:
          name: wheel-and-smoke-report
          path: |
            dist/*.whl
            out/wheel-e1-e2-report.json
          if-no-files-found: error
          retention-days: 14
