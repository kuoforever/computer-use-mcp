# Experimental OpenAI read-only Agent example. This file contains no API keys.
# Provider adapters read credentials from their own process environment and never
# pass them to the local MCP child.

[agent]
# Use a user-local directory, not this repository.
state_dir = "C:/Users/your-user/AppData/Local/computer-use-agent"
policy_version = "readonly-v1"

[provider]
# Supported runnable values: "openai" or "anthropic". Install the matching
# optional SDK extra and set its API key in the host process environment.
name = "openai"
model = "your-model-id"
# Exact UTF-8 JSON byte cap for each outbound provider SDK request. This covers
# task, selected memory, tool schemas/results, images, and local message history.
max_request_bytes = 8388608
# Conservative pre-request token window for this exact provider/model pairing.
# The host charges every visible UTF-8 request byte as one input token, adds the
# output reserve, and rejects the complete request before network I/O if it
# would exceed this value. Set it to the reviewed limit for your model ID.
context_window_tokens = 128000
output_token_reserve = 1024
# Project-wide hard wall-clock bound for each provider turn. Timeout stops the
# run before any unreturned model request can become a desktop action.
request_timeout_seconds = 120

[mcp]
# The bridge executes this absolute program directly without a shell.
executable = "C:/Users/your-user/guarded-desktop-agent/.venv/Scripts/guarded-desktop-mcp.exe"
args = []
cwd = "C:/Users/your-user/guarded-desktop-agent"
# This is a reviewed server-environment override, not arbitrary host inheritance.
# The host adds safe_local mode, enabled confirmation, a 2.5-second human-idle
# threshold, and its fixed e-stop. Only the documented safe CUMCP controls are
# accepted; the MCP SDK adds a fixed OS bootstrap allowlist such as SYSTEMROOT,
# PATH, and TEMP. API keys, tokens, audit paths, and redaction controls are never
# accepted here or forwarded from the host.
environment = { CUMCP_MODE = "safe_local", CUMCP_ALLOWLIST = "notepad.exe" }

[policy]
# Project-wide Host permission mode:
# - read_only: deny side effects (default)
# - approved_actions: require one local approval for every side effect
# - agentic_actions: execute reviewed, grounded actions autonomously while the
#   safe_local MCP layer still yields to human activity and retains allowlist,
#   budgets, e-stop, audit, and no-replay safeguards. To enable it, set both
#   mode = "agentic_actions" and require_approval_for_actions = false.
mode = "read_only"
require_approval_for_actions = true
max_model_turns = 12
max_tool_calls = 32
max_side_effects = 8
# Cumulative provider-reported input-token cap. Reaching it stops before the
# next provider request; max_request_bytes remains the pre-request wire bound.
max_input_tokens = 1000000
# Hard cap for the provider-facing reduced ledger. Required policy decisions,
# the latest model continuation, and the latest observation remain atomic.
max_context_events = 128

[continuation]
# Experimental, sensitive crash reconstruction data. Disabled by default. When
# enabled, continuation.json can contain the task, assistant text, UI results,
# and PNG screenshots. It is private, short-lived, and never auto-resumed.
enabled = false
ttl_seconds = 900

[privacy]
# Optional run-scoped text pseudonymization before provider dispatch. The
# plaintext mapping remains in Host memory only. Ordinary PII is restored only
# for local final display; assigned secrets stay opaque. The privacy package's
# image path uses local Windows OCR and solid coordinate-preserving word-box
# overlays before provider dispatch. Its non-text visual-detector extension is
# intentionally dormant: no face, QR, document, signature, or DeepSeek backend
# is installed or enabled. Privacy remains incompatible with continuation until
# an OS-encrypted resumable vault is implemented.
enabled = false
detectors = ["email", "phone", "ipv4", "cn_id", "bank_card", "secret"]
# Literal case-sensitive project, customer, or person names to pseudonymize.
terms = []
# When false, or when the complete local image-redaction port is unavailable,
# screenshot is removed from the provider tool surface and calls fail closed.
image_redaction = true

[operator]
# Passive primary-display lifecycle halo for ordinary `run`/`resume` workflows.
# It accepts only fixed Host phases, never task or target content, and cannot
# approve or execute work. E-stop, human activity, and terminal states remove it.
presence_enabled = false
# Passive progress for run/plan/recovery and fixed MCP-backed campaign execution.
# It is owned by a background UI thread and cannot approve or execute work.
progress_enabled = false
reduced_motion = false
high_contrast = false
# Focus-taking multi-option approval card for approved-actions mode. The Host
# yields desktop authority before opening it; close and timeout deny.
decision_cards_enabled = false
decision_timeout_seconds = 300
# top_left | top_right | bottom_left | bottom_right
decision_card_corner = "bottom_right"
