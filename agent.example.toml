# Experimental OpenAI read-only Agent example. This file contains no API keys.
# Provider adapters read credentials from their own process environment and never
# pass them to the local MCP child.

[agent]
# Use a user-local directory, not this repository.
state_dir = "C:/Users/your-user/AppData/Local/computer-use-agent"
policy_version = "readonly-v1"

[provider]
# Supported runnable values: "openai" or "anthropic". Install the matching
# optional SDK extra and set its API key in the host process environment.
name = "openai"
model = "your-model-id"
# Exact UTF-8 JSON byte cap for each outbound provider SDK request. This covers
# task, selected memory, tool schemas/results, images, and local message history.
max_request_bytes = 8388608
# Conservative pre-request token window for this exact provider/model pairing.
# The host charges every visible UTF-8 request byte as one input token, adds the
# output reserve, and rejects the complete request before network I/O if it
# would exceed this value. Set it to the reviewed limit for your model ID.
context_window_tokens = 128000
output_token_reserve = 1024

[mcp]
# The bridge executes this absolute program directly without a shell.
executable = "C:/Users/your-user/computer-use-mcp/.venv/Scripts/computer-use-mcp.exe"
args = []
cwd = "C:/Users/your-user/computer-use-mcp"
# This is a reviewed server-environment override, not arbitrary host inheritance.
# The host adds safe_local mode, enabled confirmation, a 2.5-second human-idle
# threshold, and its fixed e-stop. Only the documented safe CUMCP controls are
# accepted; the MCP SDK adds a fixed OS bootstrap allowlist such as SYSTEMROOT,
# PATH, and TEMP. API keys, tokens, audit paths, and redaction controls are never
# accepted here or forwarded from the host.
environment = { CUMCP_MODE = "safe_local", CUMCP_ALLOWLIST = "notepad.exe" }

[policy]
# The default denies all side-effecting tools. Even approved_actions retains a
# local host approval for every action in the safety MVP.
mode = "read_only"
require_approval_for_actions = true
max_model_turns = 12
max_tool_calls = 32
max_side_effects = 8
# Cumulative provider-reported input-token cap. Reaching it stops before the
# next provider request; max_request_bytes remains the pre-request wire bound.
max_input_tokens = 1000000
# Hard cap for the provider-facing reduced ledger. Required policy decisions,
# the latest model continuation, and the latest observation remain atomic.
max_context_events = 128

[continuation]
# Experimental, sensitive crash reconstruction data. Disabled by default. When
# enabled, continuation.json can contain the task, assistant text, UI results,
# and PNG screenshots. It is private, short-lived, and never auto-resumed.
enabled = false
ttl_seconds = 900
